<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiBev - Change Request Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-gray-50 py-10 px-4">

    <div class="max-w-[800px] mx-auto mb-6 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
        <h1 class="text-lg font-bold text-gray-800">ระบบกรอกแบบฟอร์ม Change Request</h1>
        <button id="downloadPdfBtn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-md shadow transition flex items-center gap-2">
            💾 บันทึกและดาวน์โหลด PDF
        </button>
    </div>

    <div class="form-container border border-gray-200">
        <div class="border-b border-gray-300 pb-4 mb-6">
            <h2 class="text-xl font-bold text-green-700">ThaiBev</h2>
            <p class="text-sm text-gray-500">Change Request Application Form</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6 bg-gray-50 p-3 rounded">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Doc. No. / เลขที่เอกสาร</label>
                <input type="text" id="docNo" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none bg-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Doc. Date / วันที่เอกสาร</label>
                <input type="date" id="docDate" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none bg-white">
            </div>
        </div>

        <div class="mb-6">
            <h3 class="text-sm font-bold text-gray-800 bg-gray-100 p-2 rounded mb-3">Part 1: For Requester / ส่วนที่ 1: สำหรับผู้แจ้ง</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Name / ชื่อ-นามสกุล</label>
                    <input type="text" id="reqName" value="โคมน อาจสาครมงคล" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Employee ID / รหัสพนักงาน</label>
                    <input type="text" id="reqId" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Department / หน่วยงาน</label>
                    <input type="text" id="reqDept" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Phone / เบอร์ติดต่อ</label>
                    <input type="text" id="reqPhone" value="0634465136" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Company / บริษัท</label>
                    <input type="text" id="reqComp" value="nookpass@gmail.com (TH)" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">E-mail</label>
                    <input type="email" id="reqEmail" value="nookpass@gmail.com" class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none">
                </div>
            </div>
        </div>

        <div class="mb-6">
            <h3 class="text-sm font-bold text-gray-800 bg-gray-100 p-2 rounded mb-3">Requirements / รายละเอียดความต้องการ</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Objectives and requirements / วัตถุประสงค์และรายละเอียดความต้องการ</label>
                    <textarea id="objectives" class="w-full border border-gray-300 rounded px-3 py-2 text-sm h-20 outline-none resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Accounting or Revenue Department Government impact / ผลกระทบทางบัญชี หรือสรรพากร</label>
                    <textarea id="impact" class="w-full border border-gray-300 rounded px-3 py-2 text-sm h-20 outline-none resize-none"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            try {
                // ดึงค่าจากช่องกรอกต่างๆ บนหน้าเว็บ
                var docNo = document.getElementById('docNo').value || '-';
                var docDate = document.getElementById('docDate').value || '-';
                var reqName = document.getElementById('reqName').value || '-';
                var reqId = document.getElementById('reqId').value || '-';
                var reqDept = document.getElementById('reqDept').value || '-';
                var reqPhone = document.getElementById('reqPhone').value || '-';
                var reqComp = document.getElementById('reqComp').value || '-';
                var reqEmail = document.getElementById('reqEmail').value || '-';
                var objectives = document.getElementById('objectives').value || '-';
                var impact = document.getElementById('impact').value || '-';

                // เรียกเปิดระบบควบคุม jsPDF
                var InstancejsPDF = window.jspdf ? window.jspdf.jsPDF : (window.jsPDF ? window.jsPDF : null);
                if (!InstancejsPDF) {
                    alert("ระบบสร้างเอกสารขัดข้องชั่วคราว กรุณารีเฟรชหน้าเว็บ");
                    return;
                }

                var pdf = new InstancejsPDF('p', 'mm', 'a4');
                
                // ใช้ฟอนต์มาตรฐานระบบเพื่อความปลอดภัยและเสถียรสูงสุดบน Web Cloud
                pdf.setFont("Helvetica", "bold");
                pdf.setFontSize(22);
                pdf.textColor = [21, 128, 61]; // สีเขียว ThaiBev
                pdf.text("ThaiBev", 20, 25);
                
                pdf.setFont("Helvetica", "normal");
                pdf.setFontSize(14);
                pdf.textColor = [100, 100, 100];
                pdf.text("Change Request Application Form", 20, 32);
                
                // วาดเส้นแบ่งหัวข้อ
                pdf.setDrawColor(200, 200, 200);
                pdf.line(20, 38, 190, 38);
                
                // ข้อมูลเลขที่เอกสาร
                pdf.setFontSize(10);
                pdf.textColor = [50, 50, 50];
                pdf.text("Doc No: " + docNo, 130, 25);
                pdf.text("Doc Date: " + docDate, 130, 31);
                
                // ส่วนที่ 1: ข้อมูลผู้ส่ง
                pdf.setFillColor(240, 240, 240);
                pdf.rect(20, 45, 170, 8, "F");
                pdf.setFont("Helvetica", "bold");
                pdf.text("PART 1: REQUESTER INFORMATION", 24, 50.5);
                
                // รายละเอียดผู้แจ้ง (สร้างตารางข้อมูลสะอาดตาใน PDF)
                pdf.setFont("Helvetica", "normal");
                var startY = 62;
                var lineSpacing = 8;
                
                pdf.text("Requester Name: " + reqName, 22, startY);
                pdf.text("Employee ID: " + reqId, 110, startY);
                
                pdf.text("Department: " + reqDept, 22, startY + lineSpacing);
                pdf.text("Phone Number: " + reqPhone, 110, startY + lineSpacing);
                
                pdf.text("Company Name: " + reqComp, 22, startY + (lineSpacing * 2));
                pdf.text("Email Address: " + reqEmail, 110, startY + (lineSpacing * 2));
                
                // วาดเส้นกรอบล้อมรอบข้อมูลผู้แจ้ง
                pdf.rect(20, 55, 170, 26);
                
                // ส่วนที่ 2: วัตถุประสงค์ความต้องการ
                var part2Y = 90;
                pdf.setFillColor(240, 240, 240);
                pdf.rect(20, part2Y, 170, 8, "F");
                pdf.setFont("Helvetica", "bold");
                pdf.text("PART 2: OBJECTIVES & REQUIREMENTS", 24, part2Y + 5.5);
                
                pdf.setFont("Helvetica", "normal");
                pdf.text("Detail of Requirements:", 22, part2Y + 15);
                
                // ตัดคำข้อความยาวๆ ให้ขึ้นบรรทัดใหม่อัตโนมัติในกระดาษ PDF
                var splitObjectives = pdf.splitTextToSize(objectives, 160);
                pdf.text(splitObjectives, 24, part2Y + 21);
                
                var currentY = part2Y + 25 + (splitObjectives.length * 5);
                
                pdf.text("Accounting or Government Impact:", 22, currentY);
                var splitImpact = pdf.splitTextToSize(impact, 160);
                pdf.text(splitImpact, 24, currentY + 6);
                
                // ส่วนท้ายแผ่นเอกสาร
                pdf.setDrawColor(220, 220, 220);
                pdf.line(20, 275, 190, 275);
                pdf.setFontSize(8);
                pdf.textColor = [150, 150, 150];
                pdf.text("TBV-ITD-FM-005 Rev.2.0 | Automated Digital Form System", 20, 280);
                
                // สั่งเซฟดาวน์โหลดไฟล์ทันที
                pdf.save('Change_Request_' + (docNo !== '-' ? docNo : 'Document') + '.pdf');
                
            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดภายในโครงสร้างคำสั่งกรอกแบบฟอร์ม กรุณาลองใหม่อีกครั้ง");
            }
        });
    </script>
</body>
</html>
